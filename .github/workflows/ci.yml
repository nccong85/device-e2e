name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -S warning tests/*.sh

      - name: Tests
        run: bash tests/run.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/device-e2e

  # The harness also runs on a Windows host that drives an Android phone over adb.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 has no os.fchmod on Windows; the harness must not need it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        shell: bash
        run: bash tests/run.sh
